[workspace]
members = [
  "crates/agent2d-core",
  "crates/agent2d-cli",
  "crates/agent2d-compression",
  "crates/agent2d-sr",
  "crates/agent2d-pipeline",
  "apps/desktop/src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.87"
license = "MIT"
publish = false

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
image = { version = "=0.25.9", default-features = false, features = ["avif", "bmp", "jpeg", "png", "tiff", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
vtracer = "=1.0.0-alpha.4"
