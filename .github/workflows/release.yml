name: Release Agent-2D

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Validate release tag
        working-directory: apps/desktop
        run: |
          APP_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          test "${GITHUB_REF_NAME}" = "v${APP_VERSION}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match app version v${APP_VERSION}."
            exit 1
          }

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build signed updater release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Agent-2D ${{ github.ref_name }}
          releaseBody: "See the repository history and release notes for changes in this version."
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: true
          args: --config src-tauri/tauri.release.conf.json --target aarch64-apple-darwin
