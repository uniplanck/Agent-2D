name: Release Agent-2D

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Validate release tag
        working-directory: apps/desktop
        run: |
          APP_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          test "${GITHUB_REF_NAME}" = "v${APP_VERSION}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match app version v${APP_VERSION}."
            exit 1
          }

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build signed updater release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Agent-2D ${{ github.ref_name }}
          releaseBody: "Download Agent-2D-macOS-arm64.zip, unzip it, and open Agent-2D.app. No Rust, Node.js, Xcode, Homebrew, or Terminal setup is required for normal Desktop use."
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: true
          args: --config src-tauri/tauri.release.conf.json --target aarch64-apple-darwin

      - name: Package general-user macOS ZIP
        shell: bash
        run: |
          set -euo pipefail
          APP="target/aarch64-apple-darwin/release/bundle/macos/Agent-2D.app"
          ZIP="Agent-2D-macOS-arm64.zip"
          test -x "$APP/Contents/MacOS/agent2d-desktop"
          file "$APP/Contents/MacOS/agent2d-desktop" | grep -q "arm64"
          codesign --verify --deep --strict "$APP"
          APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")"
          test "$APP_VERSION" = "${GITHUB_REF_NAME#v}"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"

          VERIFY_DIR="$RUNNER_TEMP/agent2d-release-zip-check"
          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"
          ditto -x -k "$ZIP" "$VERIFY_DIR"
          UNZIPPED="$VERIFY_DIR/Agent-2D.app"
          test -x "$UNZIPPED/Contents/MacOS/agent2d-desktop"
          file "$UNZIPPED/Contents/MacOS/agent2d-desktop" | grep -q "arm64"
          codesign --verify --deep --strict "$UNZIPPED"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$UNZIPPED/Contents/Info.plist")" = "$APP_VERSION"
          ls -lh "$ZIP"

      - name: Upload general-user ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" Agent-2D-macOS-arm64.zip --clobber
